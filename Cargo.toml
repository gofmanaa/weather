[package]
name = "weather"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
chrono = "0.4.44"
clap = { version = "4.6.1", features = ["derive", "string"] }
config = "0.15.22"
dotenvy = "0.15.7"
grib = "0.15.6"
openweathermap = "0.2.4"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread"] }
toml = "1.1.2+spec-1.1.0"
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }

[dev-dependencies]
assert_cmd = "2.2.1"
predicates = "3.1.4"
serial_test = "3.2.0"
temp-env = "0.3.6"
wiremock = "0.6.5"
